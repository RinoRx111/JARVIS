

services:
  # --- RELATIONAL DATABASE (POSTGRES) ---
  postgres:
    image: postgres:15-alpine
    container_name: jarvis_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jarvis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- VECTOR STORE (CHROMADB) ---
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: jarvis_chromadb
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- REDIS (CELERY BROKER & CACHE) ---
  redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FASTAPI BACKEND GATEWAY ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - workspace_data:/tmp/jarvis_workspace
      - ./groq_key.txt:/app/groq_key.txt
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- NEXT.JS FRONTEND DASHBOARD ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  # --- CELERY ASYNC WORKER ---
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app
      - workspace_data:/tmp/jarvis_workspace
      - ./groq_key.txt:/app/groq_key.txt
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
    driver: local
  chromadata:
    driver: local
  workspace_data:
    driver: local
